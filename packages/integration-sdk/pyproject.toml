[project]
name = "clinara-integration-sdk"
version = "0.0.0"
description = "Clinara HealthOS — integration-sdk"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clinara_integration_sdk"]
