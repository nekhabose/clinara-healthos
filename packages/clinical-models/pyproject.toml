[project]
name = "clinara-clinical-models"
version = "0.0.0"
description = "Clinara HealthOS — canonical clinical model and context snapshot"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "clinara-shared-types"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clinara_clinical_models"]
