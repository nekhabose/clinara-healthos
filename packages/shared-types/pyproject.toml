[project]
name = "clinara-shared-types"
version = "0.0.0"
description = "Clinara HealthOS — shared domain event envelope and enums"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clinara_shared_types"]
