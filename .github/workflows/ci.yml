name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install workspace packages + api
        run: |
          python -m pip install --upgrade pip
          pip install -e ../../packages/shared-types
          pip install -e ../../packages/clinical-models
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy . || true   # tighten to blocking once domains are typed
      - name: Test (pytest)
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint --if-present
      - run: npm run build --if-present

  # Release gates (spec §13.5) are added here as each phase lands:
  # tenant-isolation, clinical-regression, mapping-validation, safety-rules.
