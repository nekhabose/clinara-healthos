# A1C above configured target, still sub-critical (spec §6.5.3 example, Phase 1).
# Versioned, code-reviewed artifact — NOT application logic. The engine loads this as data.
id: a1c_above_target
version: 1
marker: hemoglobin_a1c
scope:
  specialties:
    - primary_care
    - endocrinology
when:
  all:
    - fact: patient.has_diabetes
      operator: equals
      value: true
    - fact: lab.a1c
      operator: greater_than_or_equal
      value: 7.0
    - fact: lab.a1c
      operator: less_than
      value: 9.0
then:
  classification: clinician_review_required
  recommended_action: evaluate_current_plan
  recommended_interval_days: 90
  patient_template: diabetes_a1c_above_target_v1
  clinician_context:
    - prior_a1c
    - diabetes_medications
    - renal_function
    - last_diabetes_visit
  reason_codes:
    - A1C_ABOVE_CONFIGURED_TARGET
safety:
  requires_manual_review: false
  excluded_when:
    - patient.pregnancy
    - patient.pediatric_patient
